# 화면 문구와 동작 설정
# 문구를 바꾸고 싶으면 이 파일만 고치면 됩니다.

app_title: "나에게 맞는 안산 프로그램 찾기"
top_n: 3                      # 유형마다 먼저 보여줄 곳의 수. 나머지는 '더 보기'를 눌러야 나옵니다.
# 응답 기록(app/logs)을 남길지. 기본은 남기지 않습니다(false).
# 유형별로 몇 명이 골랐는지 세고 싶을 때만 true로 바꿉니다. 켜면 시작 화면 문구가 '저장해요'로 바뀌고,
# 참여자에게도 저장한다는 사실을 알려야 합니다. 남는 것은 고른 선택지 id와 시간(시 단위)뿐입니다.
save_log: false
show_error_kind: true         # AI 호출이 실패하면 원인 종류를 화면에 작게 보여줌 (점검용. 실험 전에 false로)

# 대표 유형을 정하는 기준 (유형 점수는 두 문항 합산 2~10점)
# 검증된 검사 기준이 아니라 시범 운영 규칙입니다. 실제 답변과 결과 납득 여부를 보고 고칩니다.
scoring:
  high: 8                     # 이 점수 이상이고 단독 1위면 대표 유형으로 보여줌. 동점이면 본인이 고름
  confirm: 7                  # 최고점이 이 점수면 후보로 보여주고 본인이 확인해야 대표가 됨. 이보다 낮으면 둘러보기

llm:
  provider: gemini           # gemini(구글, 무료 구간 사용) 또는 anthropic
  # 무료 구간 한도는 모델마다 다릅니다. gemini-3.5-flash-lite는 하루 500회, 분당 15회입니다 (2026-11-18 AI Studio 확인).
  # gemini-3.8-flash는 무료로 하루 20회뿐이라 쓰지 않습니다. 한도는 https://aistudio.google.com/rate-limit 에서 봅니다.
  model: gemini-3.5-flash-lite   # 사용할 AI 모델. anthropic이면 claude-opus-5-5 등
  effort: low                 # 생각하는 깊이 (low / medium / high). 낮을수록 빨리 답합니다.
  timeout_seconds: 60         # 이 시간 안에 답이 없으면 실패로 처리

text:
  # ── 시작 화면 ──
  start_intro: "질문에 답하면, 지금 먼저 살펴볼 도움과 안산에서 물어볼 수 있는 곳을 찾아 드려요."
  start_time: "질문은 28개예요. 하나씩 눌러서 답하면 3~4분쯤 걸려요."
  start_privacy: "이름이나 연락처는 묻지 않아요. 고르신 답은 저장하지 않아요. 결과 화면에서 글을 직접 적고 찾아보기 단추를 누를 때만, 그 글을 AI 서비스로 보내요."            # save_log가 false일 때
  start_privacy_saving: "이름이나 연락처는 묻지 않아요. 고르신 항목만 익명으로 저장해요."  # save_log가 true일 때
  start_button: "시작하기"

  # ── 질문 화면 ──
  scale_help: "요즘 내 마음과 얼마나 비슷한지 골라주세요. 정답은 없어요."   # 척도 문항(Q01~Q24) 아래 안내
  progress_before: "먼저 여쭤볼게요 {number} / {total}"     # 척도 문항 앞의 문항(기본정보)
  progress_scale: "질문 {number} / {total}"                 # 척도 문항
  progress_after: "마지막으로 여쭤볼게요"                    # 척도 문항 뒤의 문항(걸림돌). {number}, {total}도 쓸 수 있음
  number_placeholder: "여기를 눌러 숫자를 적어 주세요"
  number_next: "다음"
  skip_number: "적지 않고 넘어가기"
  multi_help: "해당하는 것을 모두 누른 뒤, 아래 '다음'을 눌러 주세요."
  next_button: "다음 ({count}개 골랐어요)"
  skip_button: "고르지 않고 넘어가기"
  back_button: "← 이전으로"

  # ── 결과 화면 ──
  # 대표 유형이 정해졌을 때: 상자 안에 type_label → 유형 이름 → 유형 설명(types.yaml의 statement) 순서로 보입니다.
  type_label: "지금 먼저 살펴볼 유형은"
  type_label_other: "함께 살펴보는 분야"          # 본인이 눌러서 연 다른 유형의 상자
  result_intro: "아래는 지금 문의할 수 있다고 확인한 곳이에요. 이용할 수 있는지는 기관에 물어봐야 정확해요."
  secondary_heading: "이 분야도 함께 살펴보세요."   # 대표 유형 다음으로 점수가 높은 유형이 하나일 때
  more_types_button: "다른 분야도 보기"
  also_heading: "관심이 높다고 답하신 분야"
  # 점수가 같거나(동점) 확인이 필요한 점수(7점)일 때: 아래 문장 + questions.yaml의 Q_PRIORITY 질문이 나옵니다.
  tie_two: "둘 다 관심이 있으시네요."
  tie_many: "여러 분야에 관심이 있으시네요."
  confirm_one: "이 분야에 관심이 있으신 것 같아요. 맞으면 눌러 주세요."
  repick_button: "먼저 볼 분야 다시 고르기"
  # 대표 유형이 없을 때
  result_heading: "이런 곳에 물어볼 수 있어요"
  low_interest: "아직 한 가지로 정하기 어려워요. 어떤 도움이 있는지 먼저 둘러볼까요?"
  incomplete_all: "답하신 질문이 적어서 아직 분야를 정하지 않았어요. 어떤 도움이 있는지 먼저 둘러볼까요?"
  edit_hint: "답을 고치고 싶으면 맨 아래 '← 이전으로'를 눌러 주세요."
  incomplete_note: "답하지 않은 분야는 아직 판단하지 않았어요."
  detail_label: "조금 더 맞춰 보기 (안 골라도 돼요)"
  contacts_heading: "지금 문의할 수 있는 곳"
  lists_heading: "목록에서 직접 찾아보기"
  more_button: "다른 곳 더 보기 ({count}곳)"
  no_program: "이 도움은 지금 안내할 곳을 아직 확인하지 못했어요. 대신 무엇이 맞을지 함께 찾아 주는 곳을 안내해 드려요."
  no_program_at_all: "지금 안내할 수 있는 곳을 찾지 못했어요. 아래 창구에 물어보시면 도와드려요."
  unknown_intro: "아직 정하지 않으셔도 괜찮아요. 무엇이 맞을지 함께 찾아 주는 곳부터 안내해 드려요."   # '아직 고르지 않을게요'를 눌렀을 때
  browse_heading: "어떤 도움이 있는지 둘러보기"
  browse_help: "궁금한 것을 누르면 그 단추 바로 아래에 안내가 나와요. 여러 개 눌러도 돼요."
  consult_heading: "무엇이 맞을지 함께 찾아 주는 곳"

  # ── 직접 적기 (적은 사람에게만 AI가 정보표 안에서 골라 덧붙여요) ──
  # 질문 문구는 questions.yaml의 Q_FREE에서 고칩니다.
  # llm.provider를 바꾸면 아래 문구의 (구글)도 함께 고쳐 주세요.
  free_privacy: "이름, 전화번호, 주민번호, 주소는 적지 말아 주세요. '찾아보기'를 누르면 적으신 글을 맞는 곳을 고르기 위해 외부 AI 서비스(구글)로 보내요. 이 앱에는 글을 남기지 않아요."
  free_button: "적은 내용으로 찾아보기"
  free_empty: "먼저 위 칸에 원하는 점을 적어 주세요."
  free_wait: "적어 주신 내용에 맞는 곳을 찾고 있어요. 길면 1분쯤 걸려요. 화면을 그대로 두고 기다려 주세요."
  ai_heading: "적어 주신 내용에 맞는 곳"
  ai_reason: "적어 주신 글을 보고 AI가 고른 이유예요. 정확한 내용은 기관에 확인해 주세요."
  ai_seen_note: "자세한 안내는 아래쪽 '{type}'에 있어요."
  ai_stale: "글을 고치셨으면 '적은 내용으로 찾아보기'를 다시 눌러 주세요."
  ai_none: "적어 주신 내용에 꼭 맞는 곳은 아직 찾지 못했어요. 함께 찾아 주는 곳에 물어보시면 도와드려요."
  ai_unmatched: "이 부분은 꼭 맞는 곳을 아직 찾지 못했어요: {items}. 함께 찾아 주는 곳에 물어보시면 도와드려요."
  ai_fail: "지금은 적어 주신 내용으로 찾기가 잘 되지 않아요. 잘못 누르신 것은 아니에요. 아래에 안내한 곳은 그대로 보실 수 있고, 잠시 뒤에 다시 눌러 보셔도 돼요."

  # ── 결과 카드 ──
  kind_always: "언제든 문의할 수 있어요"          # 종류가 상시서비스일 때
  kind_period: "기간이 정해져 있어요"            # 종류가 기간프로그램일 때
  kind_list: "목록이에요"                        # 종류가 목록일 때
  nationwide: "전국 어디서나 전화·온라인으로"     # 범위가 전국일 때
  card_about: "이런 곳이에요"
  card_ask: "물어볼 준비"
  card_contact: "문의·신청 방법"
  target_label: "대상"
  first_visit_label: "처음 가면"
  check_heading: "먼저 확인해 보세요"
  unconfirmed: "{column}: 아직 확인하지 못했어요. 기관에 물어봐 주세요."
  age_unconfirmed: "55~64세도 이용할 수 있는지 기관에 물어봐 주세요."
  worry_heading: "마음에 걸린다고 하신 점"
  say_prefix: "이렇게 물어보세요"
  call_button: "전화로 물어보기"
  apply_button: "신청 페이지 열기"
  detail_button: "자세히 보기"
  seen_note: "위쪽 '{type}'에서 안내한 곳이에요."
  list_note: "지금 신청할 수 있는 강좌가 있는지는 목록에서 직접 확인해 주세요."
  list_button: "목록 열기"
  checked_note: "{date} 기준 정보예요. 신청 전에 기관에 꼭 확인해 주세요."

  # ── 맨 아래 ──
  capture_tip: "이 화면을 캡처해 두면 나중에 다시 볼 수 있어요."
  restart_button: "처음부터 다시 하기"
  disclaimer: "성격이나 건강을 진단하는 검사가 아니에요. 지금 관심 있는 것을 정리해 안산의 지원을 찾아보도록 돕는 안내예요. 지원 대상으로 선정되거나 취업이 정해졌다는 뜻도 아니에요."

# 정보표를 읽지 못하는 등 안내할 곳이 하나도 없을 때 보여주는 기본 창구.
# 평소의 일반 창구는 programs.csv에서 '첫상담'이 Y인 행(JOB07, G01)입니다. 번호가 바뀌면 두 곳을 함께 고쳐 주세요.
# 2026-11-17 안산시청 안내 페이지에서 확인한 내용입니다.
fallback_card:
  name: "생애설계 상담 (이모작상담)"
