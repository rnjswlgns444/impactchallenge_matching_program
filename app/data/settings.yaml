# 화면 문구와 동작 설정
# 문구를 바꾸고 싶으면 이 파일만 고치면 됩니다.

app_title: "나에게 맞는 안산 프로그램 찾기"
top_n: 1                      # 유형마다 먼저 보여줄 곳의 수. 나머지는 '더 보기'를 눌러야 나옵니다.
ai_top_n: 3                   # 직접 적은 글로 AI가 더 찾아 주는 곳의 최대 개수
# 응답 기록(app/logs)을 남길지. 기본은 남기지 않습니다(false).
# 실험에서 답과 결과를 세고 싶을 때만 true로 바꿉니다. 켜면 시작 화면 문구가 '저장해요'로 바뀌고,
# 참여자에게도 저장한다는 사실을 알려야 합니다.
# 남는 것: 척도 답(1~5), 유형 점수와 결과, 걸림돌, 화면에 나온 곳, 열어 본 안내, 시간(시 단위).
# 남지 않는 것: 성별·나이·일 여부(맞는 곳을 고르는 데만 씀), 마음·건강 세부 선택, 직접 적은 글, 이름·연락처(묻지 않음).
save_log: false
show_error_kind: false        # true면 AI 호출이 실패했을 때 원인 종류를 화면에 작게 보여줌 (점검용. 실험 때는 false)

# 유형 점수는 두 문항 합산 2~10점입니다. 점수가 가장 높은 유형을 대표 유형으로 보여 줍니다(동점이면 본인이 고름).
# 검증된 검사 기준이 아니라 시범 운영 규칙입니다. 실제 답변과 결과 납득 여부를 보고 고칩니다.
scoring:
  high: 8                     # 대표 유형 말고도 이 점수 이상인 유형이 있으면 '함께 살펴볼 유형'으로 보여줌

llm:
  provider: gemini           # gemini(구글, 무료 구간 사용) 또는 anthropic
  # 무료 구간 한도는 모델마다 다릅니다. gemini-3.5-flash-lite는 하루 500회, 분당 15회입니다 (2026-11-18 AI Studio 확인).
  # gemini-3.8-flash는 무료로 하루 20회뿐이라 쓰지 않습니다. 한도는 https://aistudio.google.com/rate-limit 에서 봅니다.
  model: gemini-3.5-flash-lite   # 사용할 AI 모델. anthropic이면 claude-opus-5-5 등
  effort: low                 # 생각하는 깊이 (low / medium / high). 낮을수록 빨리 답합니다.
  timeout_seconds: 60         # 이 시간 안에 답이 없으면 실패로 처리

# 직접 적기 칸에 아래 말만 적으면 AI를 부르지 않고 "조금만 더 적어 주세요"라고 안내합니다.
# 띄어쓰기와 마침표는 무시하고, 글 전체가 아래 말과 같을 때만 해당합니다("없어요."는 걸리고 "허리 아픈 데 없어요"는 안 걸림).
# "ㅇ", "ㅋㅋ", "..."처럼 글자가 되지 않는 것은 여기 적지 않아도 걸러집니다.
free_empty_words:
  - 없어
  - 없어요
  - 없음
  - 없다
  - 없습니다
  - 없네요
  - 딱히
  - 딱히 없어요
  - 별로
  - 별로 없어요
  - 특별히 없어요
  - 몰라
  - 몰라요
  - 모름
  - 모르겠어요
  - 잘 모르겠어요
  - 글쎄
  - 글쎄요
  - 그냥
  - 그냥요
  - 아니
  - 아니요
  - 아니오
  - 네
  - 예
  - 응
  - 음

text:
  # ── 시작 화면 ──
  start_heading: "나는 어떤 유형일까요?"   # 시작 화면의 큰 제목
  team_name: "안산노믹스"                  # 팀 이름. 결과 사진에 들어갑니다
  start_intro: "질문에 답하면 내 유형과, 안산에서 가 볼 곳을 알려 드려요."
  # 유의사항: 시작 화면 맨 아래에 작은 회색 글씨로 한 줄씩 나옵니다(11/25). 실제로 저장·전송하는 것과 같아야 합니다.
  # 순서: start_privacy → start_ai_note → start_refresh → disclaimer(맨 아래 '맨 아래' 묶음에 있습니다)
  start_notes_title: "유의사항"
  start_privacy: "이름·연락처는 묻지 않아요. 성별·태어난 해·일 여부는 맞는 곳과 결과 그림을 고르는 데만 쓰고, 고르신 답은 저장하지 않아요."   # save_log가 false일 때만 나옵니다
  start_ai_note: "'맞춰 보기' 화면에서 글을 적고 '결과 보기'를 누를 때만, 그 글과 살펴보는 분야, 고르신 세부 항목과 마음에 걸리는 점을 AI 서비스로 보내요."   # AI로 글을 보내는 때. 실제로 보내는 화면·단추와 같아야 합니다. save_log가 false일 때만 나옵니다
  start_refresh: "새로고침을 하거나, 화면을 아래로 끌어내리거나, 뒤로 가기를 누르면 답이 지워져요. 앞 질문으로 갈 때는 화면 아래 '← 이전으로'를 눌러 주세요."
  # save_log가 true일 때: 저장한다는 사실이라 작은 글씨로 내리지 않고 시작 단추 위에 상자로 보여 줍니다. 실제로 남는 것과 같아야 합니다
  start_privacy_saving: "이름이나 연락처는 묻지 않아요. 성별·태어난 해·일 여부는 맞는 곳과 결과 그림을 고르는 데만 쓰고 저장하지 않아요. 질문에 고르신 답과 어떤 안내를 열어 보셨는지는 이름 없이 저장해요. 직접 적은 글은 저장하지 않고, '결과 보기'를 누를 때만 AI 서비스로 보내요."
  start_button: "시작하기"
  start_browse_button: "질문 없이 먼저 둘러보기"            # 첫 화면의 둘째 단추. 설문을 건너뛰고 분야 목록으로 간다
  browse_intro: "질문 없이 어떤 곳이 있는지 둘러보는 화면이에요. 궁금한 분야를 눌러 보세요. 나에게 맞는 곳부터 보고 싶으면 맨 아래 단추를 눌러 주세요."   # 분야 목록 화면 맨 위
  browse_to_survey: "질문에 답하고 나에게 맞는 곳 보기"
  type_label_browse: "살펴보는 분야"                        # 질문 없이 둘러볼 때 유형 이름 위의 작은 글
  browse_to_start: "처음 화면으로"
  # ── 맨 위 띠 (모든 화면) ──
  top_title: "ANTI"                     # 띠 왼쪽의 앱 이름. 결과 사진 맨 위에도 들어갑니다. 지우면 app_title이 나옵니다
  top_sub: "안산 다음걸음 유형 찾기"     # 앱 이름 아래의 작은 풀이
  to_start_button: "처음으로"           # 띠 오른쪽 단추(결과·둘러보기 화면에만). 설문 중에는 나오지 않습니다
  # '처음으로'나 '처음부터 다시 하기'를 누르면 뜨는 되묻는 창. 답이 있을 때만 묻습니다
  restart_ask_title: "처음으로 갈까요?"
  restart_ask_body: "처음으로 가면 답이 지워져요. 결과를 남기려면 먼저 '내 결과 저장하기'를 눌러 주세요."
  restart_keep: "계속 보기"
  restart_go: "처음으로 가기"

  # ── 질문 화면 ──
  scale_help: "요즘 내 마음과 얼마나 비슷한지 골라주세요. 정답은 없어요."   # 척도 문항(Q01~Q24) 아래 안내
  progress_scale: "질문 {number} / {total}"                 # 기본정보부터 걸림돌까지 전체에서 몇 번째 문항인지
  cheer_half: "절반 왔어요"                                 # 진행 표시 옆의 응원 한 줄. 딱 절반째 문항에서 나옵니다
  cheer_last: "거의 다 왔어요"                              # 마지막 세 문항에서 나옵니다
  number_placeholder: "예) 1966"                            # 숫자 칸이 비어 있을 때 칸 안에 흐리게 보이는 글
  number_next: "다음"
  multi_help: "해당하는 것을 모두 누른 뒤, 아래 '다음'을 눌러 주세요. 하나는 골라야 넘어가요."
  next_button: "다음"                                       # 고르는 문항 아래의 단추. 하나를 골라야 켜지고, 눌러야 넘어갑니다
  number_required: "태어난 해를 숫자 네 자리로 적어 주세요. 예) 1966"         # 숫자를 적지 않고 다음을 눌렀을 때
  back_button: "← 이전으로"

  # ── 조금 더 맞춰 보기 (설문 끝과 결과 사이의 화면. 전부 선택 사항입니다) ──
  # 대표 유형의 세부 질문(types.yaml의 detail)과 직접 적기(questions.yaml의 Q_FREE)가 나옵니다. 유형 이름은 아직 보여 주지 않습니다.
  tune_badge: "질문은 끝났어요"                    # 화면 맨 위의 작은 알약 글. '또 설문'으로 읽히지 않게 합니다
  tune_heading: "조금 더 맞춰 보기"
  tune_help: "고르거나 적으시면 거기에 맞춰 안내해 드려요. 안 하셔도 괜찮아요."
  tune_skip: "건너뛰고 결과 보기 ›"                # 맨 위의 글 단추. 적은 글은 버리고 결과로 갑니다
  tune_done: "결과 보기"                           # 맨 아래 단추. 글을 적었으면 이때 AI 서비스로 보냅니다
  tune_again: "바라는 점 다시 적기"                # 결과 화면 '더 보기' 안. 이 화면으로 다시 옵니다

  # ── 결과 화면 ──
  # 순서(11/25): 유형 카드(그림 → type_label → 유형 이름 → 설명) → 내 특징 자세히 보기 → 첫걸음 지도 → 저장·공유 → 더 보기
  # 유형 카드 맨 위에는 캐릭터 그림이 나옵니다(app/ui/assets/type-characters, 답한 성별의 그림).
  type_label: "나의 유형"                         # 유형 이름 위의 작은 딱지
  type_image_alt: "{name} 캐릭터 그림"            # 그림을 볼 수 없는 분께 읽어 주는 설명. {name}은 유형 이름
  type_label_other: "함께 살펴보는 분야"          # 본인이 눌러서 연 다른 유형의 상자
  feature_open: "내 특징 자세히 보기"             # 유형 설명 아래의 단추. 누르면 그 자리에 특징 글(types.yaml의 feature)이 펼쳐집니다
  feature_close: "특징 접기"
  # 첫걸음 지도: 대표 유형의 곳을 핀으로 최대 3곳 놓습니다. 핀을 누르면 그 곳의 안내 화면으로 갑니다.
  # 핀 안의 그림은 programs.csv의 '핀그림' 칸이 정합니다. 실제 지도가 아니라 꾸밈 그림입니다.
  map_heading: "첫걸음 지도"
  pin_more: "다른 곳 {count}곳"                   # 곳이 3곳보다 많을 때 네 번째 자리에 나오는 핀. 누르면 나머지 곳의 목록으로 갑니다
  more_places_heading: "{type}의 다른 곳"         # 그 목록 화면의 제목. {type}은 유형 이름
  back_label: "뒤로"                              # 안내 화면 맨 위 화살표 단추를 읽어 주는 이름(화면에는 화살표만 보입니다)
  back_to_result: "← 결과로 돌아가기"             # 안내 화면 맨 아래 단추
  map_checked_note: "곳의 정보는 {date}에 확인했어요. 신청 전에 기관에 꼭 확인해 주세요."   # 결과 화면 맨 아래 작은 글. 지도에 놓인 곳 가운데 가장 오래된 확인 날짜
  more_toggle: "더 보기"                          # 접힌 칸을 여는 단추: 다른 분야, 함께 찾아 주는 곳, 답변 확인·수정, 바라는 점 다시 적기
  more_toggle_close: "더 보기 접기"
  secondary_heading: "이 분야도 함께 살펴보세요."   # 대표 유형 다음으로 점수가 높은 유형이 하나일 때
  more_types_button: "다른 분야도 보기"
  also_heading: "관심이 높다고 답하신 분야"
  # 가장 높은 점수의 유형이 여럿일 때(동점): 아래 문장 + questions.yaml의 Q_PRIORITY 질문이 나옵니다.
  # 전부 낮게 답한 사람에게도 나오므로 '관심이 있으시네요'라고 단정하지 않습니다.
  tie_two: "두 분야를 비슷하게 답하셨어요."
  tie_many: "비슷하게 답하신 분야가 여러 개예요."
  priority_example: "예: {org} · {program}"                 # 고를 유형 아래에 보여주는, 그 유형에서 지금 안내할 수 있는 곳 하나
  repick_button: "먼저 볼 분야 다시 고르기"
  edit_heading: "설문 답변 확인·수정"                       # 결과 화면 아래의 접힌 칸 제목
  edit_select: "바꿀 답을 눌러 주세요."
  edit_option: "{number}. {question} → {answer}"            # 문항마다 단추 하나. 문항 번호, 문항, 지금 답
  edit_notice: "이 답만 고치면 바로 결과로 돌아가요."         # 답 하나를 고치는 화면에서 진행 표시 대신 보여줍니다
  edit_cancel: "수정하지 않고 결과로 돌아가기"
  detail_label: "조금 더 맞춰 보기 (안 골라도 돼요)"
  contacts_heading: "지금 문의할 수 있는 곳"
  lists_heading: "목록에서 직접 찾아보기"
  more_button: "다른 곳 더 보기 ({count}곳)"
  detail_first: "먼저 위에서 하나를 골라 주세요. 고르신 내용에 맞는 곳을 보여 드려요. 맞는 것이 없으면 아래 '무엇이 맞을지 함께 찾아 주는 곳'에 물어보세요."     # 먼저 골라야 하는 세부 질문(돌봄)에 아직 답하지 않았을 때
  widened_note: "고른 주제에 딱 맞는 곳은 아직 없어요. 대신 이런 곳이 있어요."               # 고른 세부 주제에 맞는 곳이 없어 그 유형의 곳을 그대로 보여줄 때
  no_program: "이 도움은 지금 안내할 곳을 아직 확인하지 못했어요. 대신 무엇이 맞을지 함께 찾아 주는 곳을 안내해 드려요."
  no_program_at_all: "지금 안내할 수 있는 곳을 찾지 못했어요. 아래 창구에 물어보시면 도와드려요."
  browse_heading: "어떤 도움이 있는지 둘러보기"
  browse_help: "궁금한 것을 누르면 그 단추 바로 아래에 안내가 나와요. 여러 개 눌러도 돼요."
  consult_heading: "무엇이 맞을지 함께 찾아 주는 곳"

  # ── 직접 적기 ('맞춰 보기' 화면에서 적은 사람에게만 AI가 정보표 안에서 골라 지도 맨 앞에 놓아요) ──
  # 질문 문구는 questions.yaml의 Q_FREE에서 고칩니다.
