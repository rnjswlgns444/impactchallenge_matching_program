  home_button: "기관 홈페이지 보기"          # 안내 페이지도 신청 페이지도 없을 때 대신 나오는 단추
  seen_note: "위쪽 '{type}'에서 안내한 곳이에요."
  list_note: "지금 신청할 수 있는 강좌가 있는지는 목록에서 직접 확인해 주세요."
  list_button: "목록 열기"
  checked_note: "{date} 기준 정보예요. 신청 전에 기관에 꼭 확인해 주세요."

  # ── 맨 아래 ──
  capture_tip: "이 화면을 캡처해 두면 나중에 다시 볼 수 있어요."
  restart_button: "처음부터 다시 하기"
