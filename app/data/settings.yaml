  back_button: "← 이전으로"
  type_heading: "나의 유형"
  wish_help: "해당하는 것을 모두 눌러 주세요. 누르기만 해도 돼요."
  wish_text_label: "더 원하는 것이 있으면 적어 주세요. (안 적어도 돼요)"
