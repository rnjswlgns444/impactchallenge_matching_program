  detail_first: "먼저 위에서 하나를 골라 주세요. 고르신 내용에 맞는 곳을 보여 드려요. 맞는 것이 없으면 아래 '무엇이 맞을지 함께 찾아 주는 곳'에 물어보세요."     # 먼저 골라야 하는 세부 질문(돌봄)에 아직 답하지 않았을 때
