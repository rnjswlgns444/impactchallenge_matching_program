# 화면 문구와 동작 설정
# 문구를 바꾸고 싶으면 이 파일만 고치면 됩니다.

app_title: "나에게 맞는 안산 프로그램 찾기"
top_n: 3                      # 추천 프로그램 개수

llm:
  provider: gemini            # gemini(구글, 무료 구간 사용) 또는 anthropic
  model: gemini-3.8-flash     # 사용할 AI 모델. anthropic이면 claude-opus-5-5 등
  effort: low                 # anthropic일 때만 쓰는 값 (low / medium / high)
  timeout_seconds: 30         # 이 시간 안에 답이 없으면 실패로 처리

text:
  start_intro: "몇 가지 질문에 답하면, 나에게 맞는 안산의 프로그램을 찾아 드려요."
