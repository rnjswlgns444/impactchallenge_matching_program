fallback_card:
  name: "[예시] 처음 오신 분 종합상담"
  org: "[예시] 중장년 지원센터"
  description: "무엇을 하고 싶은지 정해지지 않아도 편하게 이야기 나눌 수 있어요."
  phone: "031-000-0000"
  say: "처음인데요, 어떤 프로그램이 있는지 상담받고 싶어서 전화드렸어요."
  url: "https://example.com/"
