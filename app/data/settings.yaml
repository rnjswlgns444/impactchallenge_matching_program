# 화면 문구와 동작 설정
# 문구를 바꾸고 싶으면 이 파일만 고치면 됩니다.

app_title: "나에게 맞는 안산 프로그램 찾기"
top_n: 1                      # 유형마다 먼저 보여줄 곳의 수. 나머지는 '더 보기'를 눌러야 나옵니다.
ai_top_n: 3                   # 직접 적은 글로 AI가 더 찾아 주는 곳의 최대 개수
# 응답 기록(app/logs)을 남길지. 기본은 남기지 않습니다(false).
# 실험에서 답과 결과를 세고 싶을 때만 true로 바꿉니다. 켜면 시작 화면 문구가 '저장해요'로 바뀌고,
# 참여자에게도 저장한다는 사실을 알려야 합니다.
# 남는 것: 척도 답(1~5), 유형 점수와 결과, 걸림돌, 성별, 나이대(55~59세처럼 구간만), 일 여부, 시간(시 단위).
# 남지 않는 것: 나이 숫자, 직접 적은 글, 이름·연락처(묻지 않음).
save_log: false
show_error_kind: false        # true면 AI 호출이 실패했을 때 원인 종류를 화면에 작게 보여줌 (점검용. 실험 때는 false)

# 대표 유형을 정하는 기준 (유형 점수는 두 문항 합산 2~10점)
# 검증된 검사 기준이 아니라 시범 운영 규칙입니다. 실제 답변과 결과 납득 여부를 보고 고칩니다.
scoring:
  high: 8                     # 이 점수 이상이고 단독 1위면 대표 유형으로 보여줌. 동점이면 본인이 고름
  confirm: 7                  # 최고점이 이 점수면 후보로 보여주고 본인이 확인해야 대표가 됨. 이보다 낮으면 둘러보기

llm:
  provider: gemini           # gemini(구글, 무료 구간 사용) 또는 anthropic
  # 무료 구간 한도는 모델마다 다릅니다. gemini-3.5-flash-lite는 하루 500회, 분당 15회입니다 (2026-11-18 AI Studio 확인).
  # gemini-3.8-flash는 무료로 하루 20회뿐이라 쓰지 않습니다. 한도는 https://aistudio.google.com/rate-limit 에서 봅니다.
  model: gemini-3.5-flash-lite   # 사용할 AI 모델. anthropic이면 claude-opus-5-5 등
  effort: low                 # 생각하는 깊이 (low / medium / high). 낮을수록 빨리 답합니다.
  timeout_seconds: 60         # 이 시간 안에 답이 없으면 실패로 처리

# 직접 적기 칸에 아래 말만 적으면 AI를 부르지 않고 "조금만 더 적어 주세요"라고 안내합니다.
# 띄어쓰기와 마침표는 무시하고, 글 전체가 아래 말과 같을 때만 해당합니다("없어요."는 걸리고 "허리 아픈 데 없어요"는 안 걸림).
# "ㅇ", "ㅋㅋ", "..."처럼 글자가 되지 않는 것은 여기 적지 않아도 걸러집니다.
free_empty_words:
  - 없어
  - 없어요
  - 없음
  - 없다
  - 없습니다
  - 없네요
  - 딱히
  - 딱히 없어요
  - 별로
  - 별로 없어요
  - 특별히 없어요
  - 몰라
  - 몰라요
  - 모름
  - 모르겠어요
  - 잘 모르겠어요
  - 글쎄
  - 글쎄요
  - 그냥
  - 그냥요
  - 아니
  - 아니요
  - 아니오
  - 네
  - 예
  - 응
  - 음

text:
  # ── 시작 화면 ──
  start_heading: "안산에서 뭐 해볼까요?"   # 시작 화면의 큰 제목
  team_name: "안산노믹스"                  # 시작 화면과 맨 위 띠에 나오는 팀 이름
  start_audience: "50·60대 생활 안내"      # 시작 화면 맨 위, 팀 이름 옆의 작은 글
  start_image_alt: "봄날 시화호에서 카메라를 든 여성이 웃고, 옆의 남성이 다음에 찍을 풍경을 가리켜요."   # 그림을 볼 수 없는 분께 읽어 주는 설명
  start_intro: "질문에 답하면, 지금 먼저 살펴볼 도움과 안산에서 물어볼 수 있는 곳을 찾아 드려요."
  start_time: "질문은 28개예요. 하나씩 눌러서 답하면 3~4분쯤 걸려요."
  start_refresh: "도중에 새로고침을 하거나, 화면을 아래로 끌어내리거나, 휴대폰의 뒤로 가기를 누르면 답이 지워져요. 앞 질문으로 돌아갈 때는 화면 아래의 '← 이전으로'를 눌러 주세요."
  start_privacy: "이름이나 연락처는 묻지 않아요. 성별·나이·일 여부는 맞는 곳을 고르는 데만 쓰고, 고르신 답은 저장하지 않아요. 결과 화면에서 글을 직접 적고 찾아보기 단추를 누를 때만, 그 글과 살펴보는 분야를 AI 서비스로 보내요."            # save_log가 false일 때. 실제로 보내는 것과 같아야 합니다
  start_privacy_saving: "이름이나 연락처는 묻지 않아요. 성별·나이·일 여부는 맞는 곳을 고르는 데 써요. 고르신 답, 성별·나이대·일 여부, 어떤 안내를 열어 보셨는지를 이름 없이 저장해요. 직접 적은 글은 저장하지 않고, 찾아보기 단추를 누를 때만 AI 서비스로 보내요."  # save_log가 true일 때. 실제로 남는 것과 같아야 합니다
  start_button: "시작하기"
  start_browse_button: "설문 없이 분야별로 보기"            # 첫 화면의 둘째 단추. 설문을 건너뛰고 분야 목록으로 간다
  browse_intro: "설문 없이 분야별로 볼 수 있어요. 나에게 맞는 곳부터 보고 싶으면 설문을 해 보세요."   # 분야 목록 화면 맨 위
  browse_to_survey: "설문하고 나에게 맞는 곳 보기"
  browse_to_start: "처음 화면으로"
  top_title: "안산 프로그램 찾기"       # 모든 화면 맨 위 띠에 나오는 짧은 이름. 지우면 app_title이 나옵니다
  start_steps:                          # 시작 화면의 순서 안내. 1, 2, 3 번호가 자동으로 붙습니다. 지우면 나오지 않습니다
    - "질문에 답해요"
    - "먼저 살펴볼 분야를 봐요"
    - "안산에서 물어볼 곳을 알아봐요"

  # ── 질문 화면 ──
  scale_help: "요즘 내 마음과 얼마나 비슷한지 골라주세요. 정답은 없어요."   # 척도 문항(Q01~Q24) 아래 안내
