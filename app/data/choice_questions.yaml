# 새 앱(my-app)의 유형 찾기 문항 9개 (보기 고르기, 2026-11-28)
#
# 원본: 팀 자료 '중장년 12개 유형 진단 질문지 및 가중치 설계안'(PDF). 뜻과 점수는 그대로 두고 보기 글만 짧게 줄였습니다.
# Streamlit 앱(app/)은 이 파일을 읽지 않고 questions.yaml의 24문항을 그대로 씁니다.
# 기본정보(성별·태어난 해·일 여부), 동점 고르기, 직접 적기 문항은 questions.yaml의 것을 함께 씁니다.
#
#   id      : 문항 번호 (C01~). 설문 화면에 이 파일의 순서대로 나옵니다.
#   text    : 화면에 보이는 질문
#   help    : 질문 아래 작은 안내 (없으면 공통 안내 "가장 가까운 것 하나를 골라 주세요…")
#   options : 보기. 하나만 고릅니다.
#       id     : 보기 번호 (a, b, c, d). 저장되는 값입니다.
#       label  : 화면에 보이는 보기 글
#       scores : 이 보기를 고르면 더하는 점수. {유형 번호: 점수}. 화면에는 보이지 않습니다.
#
# 채점
#   1. 고른 보기의 점수를 유형별로 모두 더합니다.
#   2. 가장 높은 유형이 하나면 그 유형이 '나의 유형'입니다.
#   3. 여럿이면 tiebreak 문항에서 고른 보기가 점수를 준 유형만 남깁니다(남는 것이 없으면 그대로 둡니다).
#   4. 그래도 여럿이면 본인이 고릅니다.
#
# 바꾸면 안 되는 것
#   - 유형마다 얻을 수 있는 가장 높은 점수가 모두 같아야 합니다(지금 9.5점). 다르면 앱을 만들 때 알려 줍니다.
#   - 12개 유형 모두 어느 보기에선가 점수를 받아야 합니다.
#   - 문항 id는 C로 시작합니다. 예전 24문항(Q01~)의 답과 섞이지 않게 하려는 것입니다.

tiebreak: C03

questions:
  # ── 1단계: 지금 관심 있는 분야 ──
  - id: C01
    text: "요즘 내 일상에 가장 채우고 싶은 것은?"
    options:
      - {id: a, label: "사회에서 내 몫을 해내는 보람", scores: {T01: 1, T02: 1, T03: 1, T04: 1}}
      - {id: b, label: "지루하지 않은 하루의 즐거움", scores: {T05: 1, T06: 1, T07: 1, T08: 1}}
      - {id: c, label: "앞날 걱정을 던 든든함", scores: {T09: 1, T10: 1, T11: 1, T12: 1}}

  - id: C02
    text: "오랜만에 만난 동창의 말 중 가장 '내 얘기네' 싶은 것은?"
    options:
      - {id: a, label: "\"아직 일할 수 있는데, 집에만 있으려니 좀이 쑤시네.\"", scores: {T01: 1, T02: 1, T03: 1, T04: 1}}
      - {id: b, label: "\"시간은 많아졌는데, 뭘 하며 누구랑 보낼지 모르겠어.\"", scores: {T05: 1, T06: 1, T07: 1, T08: 1}}
      - {id: c, label: "\"몸도 예전 같지 않고, 앞으로 생활도 걱정이야.\"", scores: {T09: 1, T10: 1, T11: 1, T12: 1}}

  - id: C03
    text: "딱 한 가지만 먼저 해결된다면, 무엇이 가장 급한가요?"
    options:
      - {id: a, label: "돈이나 보람을 얻는 일과 활동", scores: {T01: 1.5, T02: 1.5, T03: 1.5, T04: 1.5}}
      - {id: b, label: "즐거움을 채울 취미·배움·사람", scores: {T05: 1.5, T06: 1.5, T07: 1.5, T08: 1.5}}
      - {id: c, label: "불안을 덜어 줄 노후·돌봄·건강", scores: {T09: 1.5, T10: 1.5, T11: 1.5, T12: 1.5}}

  # ── 2단계: 상황별 선택 ──
  - id: C04
    text: "무료 강좌 안내문에서 가장 눈길이 가는 강좌는?"
    options:
      - {id: a, label: "취업에 바로 쓰는 자격증·기술 반", scores: {T04: 2, T01: 1}}
      - {id: b, label: "작은 가게·사업 시작하기 반", scores: {T03: 2, T02: 1}}
      - {id: c, label: "그림·사진·악기 취미 입문 반", scores: {T05: 2, T06: 1}}
      - {id: d, label: "자산 관리·연금 받는 법 반", scores: {T09: 2, T10: 1}}

  - id: C05
    text: "평일 오전에 3시간이 비었어요. 무엇을 하면 가장 뿌듯할까요?"
    options:
      - {id: a, label: "이웃과 일손·돌봄을 나누는 품앗이 활동", scores: {T02: 2, T11: 1}}
      - {id: b, label: "궁금했던 분야를 책·영상으로 공부하기", scores: {T06: 2, T04: 1}}
      - {id: c, label: "걷기나 운동으로 몸 챙기기", scores: {T12: 2, T05: 1}}
      - {id: d, label: "속마음을 편하게 털어놓는 대화", scores: {T08: 2, T07: 1}}

  - id: C06
    text: "\"이것만큼은 누가 도와줬으면\" 싶을 때는?"
    options:
      - {id: a, label: "꾸준히 다닐 직장을 찾을 때", scores: {T01: 2, T03: 1}}
      - {id: b, label: "편하게 어울릴 동네 모임이 필요할 때", scores: {T07: 2, T08: 1}}
      - {id: c, label: "받을 수 있는 지원금·혜택을 놓치는 것 같을 때", scores: {T10: 2, T09: 1}}
      - {id: d, label: "나나 가족의 돌봄이 혼자 벅찰 때", scores: {T11: 2, T12: 1}}

  - id: C07
    text: "생활 안내 책자에서 가장 먼저 펼쳐 볼 쪽은?"
    options:
      - {id: a, label: "중장년 채용 박람회와 구인 기업", scores: {T01: 2, T04: 1}}
      - {id: b, label: "매주 만나 수다 떨고 나들이 가는 이웃 모임", scores: {T07: 2, T05: 1}}
      - {id: c, label: "놓치기 쉬운 생활비 지원·혜택 모음", scores: {T10: 2, T09: 1}}
      - {id: d, label: "건강 식단과 집에서 하는 체조", scores: {T12: 2, T11: 1}}

  - id: C08
    text: "내년에 꼭 이루고 싶은 목표 하나는?"
    options:
      - {id: a, label: "작은 가게나 1인 사업 시작하기", scores: {T03: 2, T02: 1}}
      - {id: b, label: "일에 쓸 자격증·기술 하나 갖추기", scores: {T04: 2, T06: 1}}
      - {id: c, label: "취미 모임에 들어가 꾸준히 활동하기", scores: {T05: 2, T07: 1}}
      - {id: d, label: "노후 자금을 상담받아 생활 계획 세우기", scores: {T09: 2, T08: 1}}

  - id: C09
    text: "하루를 마칠 때, 무엇이 생기면 마음이 가장 편할까요?"
    options:
      - {id: a, label: "무리 없이 보탬이 되는 활동을 할 때", scores: {T02: 2, T01: 1}}
      - {id: b, label: "생활 기술을 익혀 혼자 해낼 일이 늘 때", scores: {T06: 2, T03: 1}}
      - {id: c, label: "고민을 전문가와 나눠 마음이 가벼워질 때", scores: {T08: 2, T12: 1}}
      - {id: d, label: "돌봄을 함께 나눌 곳을 찾았을 때", scores: {T11: 2, T10: 1}}
