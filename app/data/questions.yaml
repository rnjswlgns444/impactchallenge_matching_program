# 문항 (전달 자료 01_질문_유형_분류규칙.json, 2026-11-16 기준)
#
# 문항은 이 파일에 적힌 순서대로 나옵니다. 모든 문항은 답하지 않고 넘어갈 수 있습니다.
# 문항 id(Q_NEEDS 등)는 코드가 그대로 쓰므로 바꾸지 마세요. 문구(text, help, label)는 자유롭게 고쳐도 됩니다.
#
#   text      : 화면에 보이는 질문
#   help      : 질문 아래 작은 안내 (없어도 됨)
#   selection : single(하나만) / multi(여러 개) / text(직접 적기)
#   options   : 선택지 (id와 label). exclusive: true인 선택지는 다른 선택지와 함께 고를 수 없습니다.
#   where     : result라고 적으면 설문이 아니라 결과 화면에서 묻습니다.
#
# 문항별 역할
#   Q_NEEDS    : 고른 문장이 그대로 유형이 됩니다. 비워 두거나 '아직 모르겠어요'를 고르면 전체 유형을 둘러봅니다.
#   Q_AWARE    : 유형을 정하는 데 쓰지 않습니다. 기록만 합니다.
#   Q_BARRIER  : 유형을 바꾸지 않습니다. 결과 카드에서 먼저 보여줄 안내를 정합니다.
#   Q_START    : 유형을 바꾸지 않습니다. 결과 카드에서 먼저 펼칠 곳을 정합니다.
#   Q_PRIORITY : 유형이 둘 이상일 때만 묻습니다. 보여주는 순서만 바꾸고 다른 유형은 그대로 둡니다.
#   Q_FREE     : 적은 사람에게만 AI 추가 추천을 합니다. 비워 두면 AI를 부르지 않습니다.

questions:
  - id: Q_NEEDS
    text: "요즘 무엇을 해보고 싶거나, 어떤 도움이 필요한가요?"
    help: "여러 개 골라도 괜찮아요."
    selection: multi
    options_from: types          # 선택지는 types.yaml의 statement에서 자동으로 만들어집니다.
    options:                     # 유형이 아닌 선택지
      - {id: unknown, label: "아직 모르겠어요", exclusive: true}

  - id: Q_AWARE
    text: "그런 도움을 주는 곳을 알아본 적이 있나요?"
    selection: single
    options:
      - {id: new, label: "처음 알아봐요"}
      - {id: name_only, label: "이름만 알아요"}
      - {id: details, label: "내용도 알아요"}
      - {id: used, label: "이용해봤어요"}

  # 걸림돌 선택지에만 있는 칸
  #   show : 이 걸림돌을 고른 사람에게 카드에서 먼저 보여줄 programs.csv의 열. 그 열에 내용이 있으면 그대로 보여줍니다.
  #   ask  : 그 열이 비어 있을 때 '기관에 이렇게 물어보세요'로 보여줄 문장. (초안입니다. 팀 검토 필요)
  - id: Q_BARRIER
    text: "시작하기 전에 마음에 걸리는 게 있나요?"
    selection: multi
    options:
      - id: fit
        label: "나에게 맞을지"
        show: [대상, 확인필요]
        ask: "제 상황에서도 이용할 수 있는지 여쭤보고 싶어요."
      - id: level
        label: "잘 따라갈 수 있을지"
        show: [초보참여]
        ask: "처음 해 보는 사람도 따라갈 수 있을까요?"
      - id: first_visit
        label: "처음 가면 무엇을 하는지"
        show: [첫방문안내]
        ask: "처음 가면 무엇부터 하게 되나요?"
      - id: alone
        label: "혼자 가는 것"
        show: [혼자참여]
        ask: "혼자 가도 괜찮을까요?"
      - id: time_care
        label: "시간이나 가족 돌봄"
        show: [시간대]
        ask: "이용할 수 있는 요일과 시간이 어떻게 되나요?"
      - id: cost
        label: "비용"
        show: [비용]
        ask: "비용이 드나요?"
      - id: application
        label: "신청 방법"
        show: [신청방법]
        ask: "신청은 어떻게 하면 되나요?"
      - {id: other, label: "다른 이유"}
      - {id: none, label: "특별히 없어요", exclusive: true}

  # 시작 방식 선택지에만 있는 칸
  #   open : 카드에서 먼저 펼칠 곳. about(이런 곳이에요) / ask(물어볼 준비) / contact(문의·신청 방법)
  - id: Q_START
    text: "어떻게 먼저 알아보면 편할까요?"
    selection: single
    options:
      - {id: read, label: "설명부터 볼게요", open: about}
      # 전달 자료의 '짧게 해볼게요'(try)는 뺐습니다. 지금 체험 자료가 있는 프로그램이 없기 때문입니다.
      - {id: prepare, label: "물어볼 준비를 할게요", open: ask}
      - {id: contact, label: "문의·신청 방법을 볼게요", open: contact}
      - {id: later, label: "나중에 볼게요"}

  # ── 결과 화면에서 묻는 문항 ──
  - id: Q_PRIORITY
    where: result
    text: "오늘은 무엇부터 볼까요?"
    selection: single
    options_from: selected_types  # 선택지는 사용자가 고른 유형으로 자동으로 만들어집니다.
    options:
      - {id: none, label: "우선순위 없이 볼게요"}

  - id: Q_FREE
    where: result
    text: "조금 더 원하는 점이 있나요?"
    help: "해보고 싶은 일이나 시작하기 전에 걱정되는 점을 편하게 적어주세요. 적지 않고 넘어가도 괜찮아요."
    selection: text
    max_characters: 500
