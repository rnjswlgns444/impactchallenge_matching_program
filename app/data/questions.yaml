# 설문 문항 (예시)
# 문항과 선택지 '내용'만 적습니다. 어떤 선택지가 어느 유형 쪽 점수인지는 rules.yaml에 적습니다.
# 문항 순서는 이 파일에 적힌 순서대로 나옵니다.
#
#   id        : 문항 번호 (영문·숫자, 바꾸면 rules.yaml도 함께 고쳐야 함)
#   text      : 화면에 보이는 질문
#   help      : 질문 아래 작은 안내 (없어도 됨)
#   options   : 선택지 목록 (id와 label)
#   show_when : {tie: 축 id} 를 넣으면 그 축이 동점일 때만 나오는 추가 문항이 됩니다.

questions:
  - id: q1
    text: "[예시] 요즘 가장 해보고 싶은 것은 무엇인가요?"
    help: "더 가까운 쪽을 골라 주세요."
    options:
      - {id: q1_a, label: "조금이라도 돈을 버는 활동"}
      - {id: q1_b, label: "배우거나 즐기는 활동"}

  - id: q2
    text: "[예시] 활동을 고를 때 무엇이 더 중요하세요?"
    help: "더 가까운 쪽을 골라 주세요."
    options:
      - {id: q2_a, label: "내 이름으로 수입이 생기는 것"}
      - {id: q2_b, label: "재미있고 보람을 느끼는 것"}

  - id: q3
    text: "[예시] 새로운 활동을 한다면 어떤 모습이 편하세요?"
    options:
      - {id: q3_a, label: "여러 사람과 함께 하는 것"}
      - {id: q3_b, label: "혼자 또는 두세 명이 조용히 하는 것"}

  - id: q4
    text: "[예시] 활동하면서 새로운 사람을 만나는 것은 어떠세요?"
    options:
      - {id: q4_a, label: "기대돼요"}
      - {id: q4_b, label: "조금 부담돼요"}

  - id: q5
    text: "[예시] 하고 싶은 것이 얼마나 정해져 있나요?"
    options:
      - {id: q5_a, label: "대략 정해져 있어요"}
      - {id: q5_b, label: "아직 잘 모르겠어요"}

  - id: q6
    text: "[예시] 처음 가는 기관에 전화하는 것은 어떠세요?"
    options:
      - {id: q6_a, label: "어렵지 않아요"}
      - {id: q6_b, label: "망설여져요"}

  # ── 동점일 때만 나오는 추가 문항 ──
  - id: qt_purpose
    show_when: {tie: purpose}
    text: "[예시] 둘 중 하나만 고른다면 어느 쪽인가요?"
    help: "두 가지 모두 원하셔서 한 번 더 여쭤봐요."
    options:
      - {id: qt_purpose_a, label: "돈을 버는 활동"}
      - {id: qt_purpose_b, label: "배우고 즐기는 활동"}

  - id: qt_people
    show_when: {tie: people}
    text: "[예시] 둘 중 하나만 고른다면 어느 쪽인가요?"
    help: "두 가지 모두 괜찮으셔서 한 번 더 여쭤봐요."
    options:
      - {id: qt_people_a, label: "여럿이 함께"}
      - {id: qt_people_b, label: "혼자 또는 조용히"}
