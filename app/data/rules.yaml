# 응답 → 유형 규칙 (예시)
# 이 파일만 고치면 유형 판정 방식이 바뀝니다. 코드 수정은 필요 없습니다.
#
# 규칙 양식은 세 가지뿐입니다.
#   1) scores    : 선택지를 고르면 어느 축의 어느 쪽(pole)에 몇 점을 줄지
#   2) tie_break : 한 축의 양쪽 점수가 같을 때 어떻게 할지
#   3) overrides : 점수와 상관없이 먼저 적용하는 예외 규칙

# 축 정의. 축 순서대로 pole 코드를 이어 붙이면 유형 코드가 됩니다. (예: M + T + W = MTW)
axes:
  - id: purpose
    label: 목적
    poles:
      - {code: M, label: 돈 버는 활동}
      - {code: J, label: 배우고 즐기는 활동}
  - id: people
    label: 사람
    poles:
      - {code: T, label: 여럿이 함께}
      - {code: S, label: 혼자 또는 조용히}
  - id: start
    label: 시작 방식
    poles:
      - {code: R, label: 바로 시작}
      - {code: W, label: 천천히 알아보며}

# 선택지 id: {축 id: pole 코드}  → 1점
# 가중치를 주려면 {축 id: {pole 코드: 점수}} 로 씁니다. 예) q2_a: {purpose: {M: 2}}
scores:
  q1_a: {purpose: M}
  q1_b: {purpose: J}
  q2_a: {purpose: M}
  q2_b: {purpose: J}
  q3_a: {people: T}
  q3_b: {people: S}
  q4_a: {people: T}
  q4_b: {people: S}
  q5_a: {start: R}
  q5_b: {start: W}
  q6_a: {start: R}
  q6_b: {start: W}
  # 동점일 때만 나오는 추가 문항
  qt_purpose_a: {purpose: M}
  qt_purpose_b: {purpose: J}
  qt_people_a: {people: T}
  qt_people_b: {people: S}

# 동점 처리
#   ask      : questions.yaml에서 show_when: {tie: 축 id} 인 문항을 추가로 보여줍니다.
#   pole 코드 : 그 쪽으로 정합니다.
tie_break:
  purpose: ask
  people: ask
  start: W

# 예외 규칙: 조건(if)이 모두 맞으면 점수와 상관없이 then의 값으로 정합니다.
# 예시) 처음 가는 기관에 전화하기가 '많이 망설여진다'면 항상 '천천히'로
overrides: []
#  - if: {q6: q6_b}
#    then: {start: W}
