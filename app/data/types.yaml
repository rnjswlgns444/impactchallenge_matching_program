# 유형 정보 (예시)
# 유형 코드는 rules.yaml의 축 순서대로 pole 코드를 이어 붙인 것입니다.
# 축 조합마다 유형이 하나씩 모두 있어야 합니다. (축 3개 × 양쪽 2개 = 8개)
#
#   name          : 유형 이름 (성별을 가정하지 않는 표현)
#   summary       : 한 줄 설명
#   tags          : 이 유형에 맞는 프로그램 분야. programs.csv의 '유형태그'와 같은 단어를 씁니다.
#   wish_question : 세부 희망을 묻는 질문
#   wish_examples : 누르기만 해도 되는 예시 버튼

types:
  - code: MTR
    name: "[예시] 함께 일하는 실행형"
    summary: "사람들과 어울리며 내 이름으로 된 수입을 바로 만들어 보고 싶은 분"
    tags: [일자리, 사회참여]
    wish_question: "어떤 일을 해보고 싶으세요?"
    wish_examples: ["짧은 시간 일하는 곳", "앉아서 하는 일", "사람을 만나는 일", "경력을 살리는 일", "자격증 따기"]

  - code: MTW
    name: "[예시] 함께 일하는 탐색형"
    summary: "사람들과 함께 일하고 싶지만, 무엇부터 할지는 천천히 알아보고 싶은 분"
    tags: [일자리, 사회참여, 상담]
    wish_question: "어떤 일에 관심이 있으세요?"
    wish_examples: ["짧은 시간 일하는 곳", "앉아서 하는 일", "사람을 만나는 일", "활동비가 있는 봉사", "어떤 일이 있는지 듣고 싶어요"]

  - code: MSR
    name: "[예시] 나만의 일 실행형"
    summary: "혼자서도 꾸준히 할 수 있는 일로 수입을 만들고 싶은 분"
    tags: [일자리, 창업]
    wish_question: "어떤 일을 해보고 싶으세요?"
    wish_examples: ["경력을 살리는 일", "작은 가게·장사", "집 가까운 곳", "자격증 따기", "앉아서 하는 일"]

  - code: MSW
    name: "[예시] 나만의 일 탐색형"
    summary: "혼자 조용히 할 수 있는 일을 찾고 있고, 먼저 차근차근 알아보고 싶은 분"
    tags: [일자리, 창업, 상담]
    wish_question: "어떤 일에 관심이 있으세요?"
    wish_examples: ["경력을 살리는 일", "작은 가게·장사", "집 가까운 곳", "어떤 일이 있는지 듣고 싶어요"]

  - code: JTR
    name: "[예시] 함께 즐기는 실행형"
    summary: "사람들과 어울려 배우고 즐기는 활동을 바로 시작하고 싶은 분"
    tags: [취미여가, 모임]
    wish_question: "어떤 활동을 해보고 싶으세요?"
    wish_examples: ["당일치기 여행·나들이", "걷기·운동", "노래·악기", "요리·공예", "동네 친구 모임"]

  - code: JTW
    name: "[예시] 함께 즐기는 탐색형"
    summary: "사람들과 어울리고 싶지만, 어떤 활동이 맞을지 천천히 알아보고 싶은 분"
    tags: [취미여가, 모임, 상담]
    wish_question: "어떤 활동에 관심이 있으세요?"
    wish_examples: ["당일치기 여행·나들이", "걷기·운동", "노래·악기", "동네 친구 모임", "어떤 활동이 있는지 듣고 싶어요"]

  - code: JSR
    name: "[예시] 혼자 배우는 실행형"
    summary: "내 속도에 맞춰 혼자 배우고 즐길 거리를 바로 시작하고 싶은 분"
    tags: [배움, 디지털, 취미여가]
    wish_question: "무엇을 배우거나 해보고 싶으세요?"
    wish_examples: ["스마트폰 배우기", "집에서 듣는 강좌", "요리·공예", "책 읽기·글쓰기"]

  - code: JSW
    name: "[예시] 혼자 배우는 탐색형"
    summary: "조용히 배워 보고 싶지만, 무엇이 맞을지 먼저 알아보고 싶은 분"
    tags: [배움, 디지털, 상담]
    wish_question: "무엇에 관심이 있으세요?"
    wish_examples: ["스마트폰 배우기", "집에서 듣는 강좌", "책 읽기·글쓰기", "어떤 배움이 있는지 듣고 싶어요"]
