# 유형 12개 (전달 자료 '안산노믹스_24문항_설문과분류규칙', 2026-11-17 기준. 유형 번호와 세부 질문은 11-16 자료와 같음)
#
# 유형은 성격 검사 결과가 아니라 '지금 필요한 도움의 이름'입니다.
# 척도 문항(questions.yaml의 Q01~Q24) 점수를 유형별로 더해, 먼저 살펴볼 유형 하나를 정합니다.
# 대표 유형이 정해져도 다른 유형을 직접 열어 볼 수 있습니다.
#
#   id         : 유형 번호. programs.csv의 '유형태그'와 questions.yaml의 type에 이 번호를 적어 연결합니다. 바꾸지 마세요.
#   area       : 둘러보기 화면에서 묶어 보여줄 영역 (아래 areas의 id)
#   name       : 유형 이름
#   purpose    : 한 줄 요약
#   statement  : 결과 화면의 유형 설명이자, 둘러보기·동점일 때 고르는 단추의 문장
#   definition : 구분 기준. 화면에는 나오지 않고, 팀원과 AI가 유형을 구분할 때 봅니다.
#   detail     : 결과 화면에서 유형을 열었을 때 보여주는 선택 질문 (답하지 않아도 됨)
#       selection : single(하나만 고름. 고른 것을 다시 누르면 풀림). 안 고르면 "아직 모르겠다"는 뜻으로 봅니다.
#       options   : 선택지. "아직 모르겠어요" 같은 선택지는 두지 않습니다.
#       exclude   : 이 선택지를 고르면 후보에서 뺄 프로그램. {programs.csv의 열 이름: [뺄 값]}
#       enabled   : false면 이 세부 질문을 화면에서 묻지 않습니다. (적지 않으면 묻습니다)
#       prominent : true면 접어 두지 않고 유형 이름 바로 아래에 보여줍니다. (적지 않으면 접어 둡니다)
#       match_tags: true면 선택지를 고른 뒤에는 그 선택지의 세부태그가 붙은 프로그램만 남깁니다.
#                   맞는 곳이 하나도 없으면 빼지 않고 이 유형의 곳을 그대로 보여 주며 그 사실을 알립니다.
#       require_choice: true면 선택지를 고르기 전에는 프로그램을 보여 주지 않습니다. (돌봄: 누구의 돌봄인지 먼저 확인)
#       log_answer: false면 기록을 켜 두어도 고른 선택지를 남기지 않습니다. 마음·건강처럼 민감한 질문에 적습니다.
#
# 세부 선택지를 프로그램과 연결하려면 programs.csv의 '세부태그'에 '질문id.선택지id'를 적습니다. 예) D02.wage_required

areas:
  - {id: work, label: "일자리"}
  - {id: leisure, label: "여가·배움·관계"}
  - {id: life, label: "생활·돌봄·건강"}

types:
  # ── 일자리 ──
  - id: T01
    area: work
    name: 일터찾기형
    purpose: 본격 재취업
    statement: "꾸준히 다닐 직장을 찾고 싶어요."
    definition: "지속적인 고용이 목적. 정규직만 뜻하지 않으며 시간제라도 꾸준히 다닐 직장을 원하면 포함."
    detail:
      id: D01
      text: "어떤 일을 찾고 계세요?"
      selection: single
      options:
        - {id: previous_work, label: "해봤던 일을 다시 하고 싶어요"}
        - {id: new_work, label: "새로운 일을 해보고 싶어요"}
        - {id: explore, label: "무슨 일을 할지부터 알아보고 싶어요"}

  - id: T02
    area: work
    name: 보탬활동형
    purpose: 단시간 일·사회참여
    statement: "짧게 일하거나 동네에서 봉사하고 싶어요."
    definition: "단시간 유급 일, 활동비가 있는 참여, 무보수 봉사를 구분. 급여 필요 응답에 봉사를 대체 추천하지 않음."
    detail:
      id: D02
      text: "활동을 한다면 보수는 어느 정도 필요하세요?"
      selection: single
      # 무보수 활동은 원하는 사람에게만 앞에 보여줍니다 (11/12 팀 초안: "무급 봉사는 희망할 때만 안내").
      #   last    : 이 값인 프로그램은 맨 뒤로 보냅니다. 이 질문에 답하지 않아도 적용됩니다.
      #   first   : 이 선택지를 고르면 이 값인 프로그램을 앞으로 가져옵니다.
      #   exclude : 이 선택지를 고르면 이 값인 프로그램을 뺍니다 (규칙 R07). 보수가 '미확인'인 것은 빼지 않습니다.
      last: {보수: [무보수]}
      options:
        - {id: wage_required, label: "급여가 꼭 필요해요", exclude: {보수: [무보수]}}
        - {id: allowance_ok, label: "교통비·식비 정도도 괜찮아요"}
        - {id: unpaid_ok, label: "급여 없는 봉사활동도 좋아요", first: {보수: [무보수]}}

  - id: T03
    area: work
    name: 내일사장형
    purpose: 창업 준비·사업 운영
    statement: "가게를 열거나 내 사업을 꾸려 가고 싶어요."
    definition: "창업·사업 운영 욕구. 예비창업자와 기존 사업자 전용 지원을 구분."
    detail:
      id: D03
      text: "사업은 어느 정도 준비하셨나요?"
      selection: single
      options:
        - {id: explore, label: "무엇을 할지 알아보는 중이에요"}
        - {id: prepare, label: "해보고 싶은 사업을 준비하고 있어요"}
        - {id: operate, label: "이미 하는 사업을 개선하고 싶어요"}

  - id: T04
    area: work
    name: 실력쌓기형
    purpose: 취업교육·자격 취득
    statement: "일에 쓸 기술을 배우거나 자격증을 따고 싶어요."
    definition: "배움의 목적이 일·취업·부업인 경우. T01·T02·T03과 함께 선택 가능."
    detail:
      id: D04
      text: "일을 위해 무엇을 배우고 싶으세요?"
      selection: single
      options:
        - {id: job_skill, label: "일할 때 쓰는 기술을 배우고 싶어요"}
        - {id: certificate, label: "자격증을 준비하고 싶어요"}
        - {id: explore, label: "무엇을 배울지부터 알고 싶어요"}

  # ── 여가·배움·관계 ──
  - id: T05
    area: leisure
    name: 취미발견형
    purpose: 취미·문화활동
    statement: "새 취미나 즐길 거리를 찾고 싶어요."
    definition: "활동 자체의 즐거움이 중심. 지속적인 사람·소속이 중심이면 T07도 선택."
    detail:
      id: D05
      match_tags: true
      text: "어떤 활동이 끌리세요?"
      selection: single
      options:
        - {id: making, label: "배우고 만들기를 하고 싶어요"}
        - {id: exercise, label: "가볍게 운동을 즐기고 싶어요"}
        - {id: culture, label: "공연·전시·축제를 즐기고 싶어요"}

  - id: T06
    area: leisure
    name: 배움산책형
    purpose: 생활·교양 배움
    statement: "새로운 지식이나 생활에 쓸 만한 걸 배우고 싶어요."
    definition: "취업 외 생활 기능·지식 학습. 디지털에 한정하지 않고, 취업 목적도 있으면 T04 추가 여부 확인."
    detail:
      id: D06
      match_tags: true
      text: "무엇을 배우고 싶으세요?"
      selection: single
      options:
        - {id: knowledge, label: "인문학·역사·외국어 등"}
        - {id: digital, label: "스마트폰·인공지능(AI) 사용법"}
        - {id: basic, label: "읽기·쓰기 등 기초"}

  - id: T07
    area: leisure
    name: 동네친구형
    purpose: 정기 모임·교류
    statement: "꾸준히 만날 사람들이나 모임을 찾고 싶어요."
    definition: "정기적인 교류·관계가 목적. 일회 행사·공연 또는 단체 공모를 개인이 가입할 모임으로 추천하지 않음."
    detail:
      id: D07
      text: "어떤 만남이 있으면 좋겠어요?"
      selection: single
      options:
        - {id: hobby_group, label: "같은 취미를 가진 사람들을 만나고 싶어요"}
        - {id: regular_group, label: "독서·걷기 등을 함께할 모임을 찾고 싶어요"}
        - {id: neighbors, label: "가까운 이웃과 어울리고 싶어요"}

  - id: T08
    area: leisure
    name: 마음쉼표형
    purpose: 마음·관계 상담
    statement: "마음에 걸리는 일이나 관계 고민을 상담하고 싶어요."
    definition: "본인이 상담을 원할 때 연결. 혼자 참여하기 어렵다는 답만으로 우울·치료 필요를 추정하지 않음."
    detail:
      id: D08
      match_tags: true
      log_answer: false   # 민감한 내용이라 고른 선택지를 기록하지 않습니다. 본인 상태가 아니라 알아볼 상담의 종류를 묻습니다.
      text: "어떤 상담을 알아볼까요?"
      selection: single
      options:
        - {id: stress, label: "마음·스트레스 상담"}
        - {id: family, label: "가족·부부 상담"}
        - {id: process, label: "처음 상담받는 방법"}

  # ── 생활·돌봄·건강 ──
  - id: T09
    area: life
    name: 노후든든형
    purpose: 연금·노후 재무계획
    statement: "연금과 노후 생활비를 미리 계산해 보고 싶어요."
    definition: "내 연금·자산·지출을 계획하는 목적. 받을 수 있는 지원금·감면 탐색은 T10."
    detail:
      id: D09
      text: "어떤 부분이 궁금하세요?"
      selection: single
      options:
        - {id: pension, label: "언제 얼마나 연금을 받을지 궁금해요"}
        - {id: cashflow, label: "앞으로 들어오고 나갈 돈을 정리하고 싶어요"}
        - {id: explore, label: "노후 준비를 어디서 시작할지 모르겠어요"}

  - id: T10
    area: life
    name: 혜택찾기형
    purpose: 지원·혜택 확인
    statement: "내가 받을 수 있는 지원금이나 혜택이 궁금해요."
    definition: "혜택 조회·신청 지원. 형편이 어렵다고 답한 사람에게만 부여하지 않음. 조회는 선정 확정이 아님."
    detail:
      id: D10
      match_tags: true
      text: "어떤 지원이 궁금하세요?"
      selection: single
      options:
        - {id: living, label: "생활비나 요금 부담을 줄이고 싶어요"}
        - {id: housing_medical, label: "주거비나 병원비 지원이 궁금해요"}
        - {id: explore, label: "어떤 혜택이 있는지 두루 보고 싶어요"}

  - id: T11
    area: life
    name: 돌봄동행형
    purpose: 본인·가족 돌봄
    statement: "나나 가족을 돌보는 데 도움받을 곳을 찾고 싶어요."
    definition: "응답자와 돌봄 대상자를 구분. 대상자의 나이·필요도를 확인하고 사업별 대상 조건 적용."
    detail:
      id: D11
      match_tags: true
      require_choice: true
      text: "누구에게 도움이 필요하세요?"
      selection: single
      prominent: true   # 누구의 돌봄인지 먼저 확인하도록 접지 않고 보여줍니다. 답하지 않으면 일반 안내만 나옵니다.
      options:
        - {id: self, label: "내 식사·집안일 등 일상에 도움이 필요해요"}
        - {id: adult, label: "부모님이나 배우자 돌봄을 나누고 싶어요"}
        - {id: child, label: "아이를 돌보는 데 도움이 필요해요"}

  - id: T12
    area: life
    name: 건강챙김형
    purpose: 건강 유지·관리
    statement: "내 건강 상태를 알고 꾸준히 챙기고 싶어요."
    definition: "건강 유지·관리 욕구. 운동의 재미가 목적이면 T05도 가능. 질환이나 치료 필요를 자동 판정하지 않음."
    detail:
      id: D12
      match_tags: true
      log_answer: false   # 민감한 내용이라 고른 선택지를 기록하지 않습니다. 본인 상태가 아니라 볼 정보의 종류를 묻습니다.
      text: "어떤 건강 정보를 볼까요?"
      selection: single
      options:
        - {id: habits, label: "운동·식습관 상담"}
        - {id: chronic, label: "고혈압·당뇨 관리 교육"}
        - {id: smoking, label: "금연 상담"}
        - {id: check, label: "국가 건강검진 대상 확인"}
